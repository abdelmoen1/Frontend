name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (0 errors required, SRS §12.1.2)
        run: npx eslint .
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://backend-sq66.onrender.com/api
